  </desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef4fb" />
      <stop offset="100%" stop-color="#c9d8ea" />
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5b88c1" />
      <stop offset="55%" stop-color="#315f9f" />
      <stop offset="100%" stop-color="#294f86" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#page)" />
  <rect x="70" y="65" width="1060" height="500" rx="12" fill="#ffffff" stroke="#8293a8" stroke-width="3" />
  <path d="M82 65h1036a12 12 0 0 1 12 12v76H70V77a12 12 0 0 1 12-12z" fill="url(#bar)" />
  <circle cx="1090" cy="109" r="9" fill="#b9d9ff" />
  <text x="110" y="121" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">
    Josh Clay's Developer Profile
  </text>

  <rect x="110" y="205" width="98" height="98" rx="10" fill="url(#bar)" />
  <text x="159" y="268" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="39" font-weight="700" text-anchor="middle">
